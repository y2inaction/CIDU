<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VCDP CIDU Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #4a9b8e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .box { background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
    .logo-box { text-align: center; margin-bottom: 25px; min-height: 140px; display: flex; align-items: center; justify-content: center; }
    .logo-box img { max-width: 140px; max-height: 140px; }
    h1 { color: #2d6b66; text-align: center; margin-bottom: 5px; font-size: 28px; }
    .sub { text-align: center; color: #999; font-size: 12px; margin-bottom: 15px; letter-spacing: 1px; }
    .badge { text-align: center; background: #e0f5f5; color: #2d6b66; padding: 6px 12px; border-radius: 12px; font-size: 10px; font-weight: bold; margin-bottom: 25px; display: inline-block; width: 100%; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; font-weight: bold; color: #333; margin-bottom: 6px; text-transform: uppercase; }
    input { width: 100%; padding: 11px 12px; border: 1.5px solid #ddd; border-radius: 4px; font-size: 14px; transition: border 0.2s; }
    input:focus { outline: none; border-color: #4a9b8e; box-shadow: 0 0 0 3px rgba(74, 155, 142, 0.1); }
    button { width: 100%; padding: 12px; background: #4a9b8e; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 14px; transition: background 0.2s; }
    button:hover { background: #2d6b66; }
    .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #999; border-top: 1px solid #eee; padding-top: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo-box">
      <img src="/static/vcdp_logo.png" alt="VCDP Logo" onerror="console.log('Logo load error')">
    </div>
    <h1>VCDP CIDU</h1>
    <p class="sub">Climate Information Dissemination & Use</p>
    <div class="badge">FGN / IFAD-VCDP</div>
    
    <form action="/login" method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit">Sign In</button>
    </form>
    
    <div class="footer">
      <p><strong>FGN / IFAD-VCDP</strong></p>
      <p>Powered by Noblen Technologies</p>
    </div>
  </div>
</body>
</html>
